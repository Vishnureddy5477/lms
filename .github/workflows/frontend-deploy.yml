name: Deploy Angular Frontend to EC2

# The assessment platform ships its frontend to S3 + CloudFront. The LMS serves
# it from nginx on the same EC2 box, so this uploads a build to a staging
# directory and swaps it in.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

concurrency:
  group: lms-frontend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` (not `npm install`) so the build uses exactly the locked
      # versions and cannot drift between a local build and CI.
      - name: Install Dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Build Angular App (production)
        run: npx ng build --configuration=production
        working-directory: ./frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # ssh-keyscan exits non-zero when it cannot reach the host, and as the last
      # command in the block that failed the whole step with no usable message.
      # It is advisory only now, and the key is validated separately so a bad
      # paste is reported as a bad paste rather than a connection error.
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

          if ssh-keygen -y -f ~/.ssh/deploy.pem > /dev/null 2>&1; then
            echo "SSH key parsed OK"
          else
            echo "::error::EC2_SSH_KEY is not a valid private key - re-paste it including the BEGIN/END lines"
            exit 1
          fi

          echo "Probing ${{ secrets.EC2_HOST }}:22 from this runner..."
          if ssh-keyscan -T 15 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "Host reachable, key pinned"
          else
            echo "::warning::ssh-keyscan could not reach the host. If the next step also fails, the EC2 security group is blocking GitHub runners on port 22."
            cat /tmp/keyscan.err || true
          fi

      # rsync, not scp, and the staging directory is deliberately NOT wiped.
      #
      # The build output is ~94MB across ~1,180 files, but almost none of it
      # changes between deploys - the dashboard theme, media and assets are
      # static, only the app bundles differ. scp -r re-sent all of it every
      # time, and at ~3MB/min to Mumbai that is a 35-minute upload. rsync
      # compares against what is already on the box and sends only the
      # difference, so a normal deploy moves 1-2MB.
      #
      # --delete keeps the staging tree exact, so a file dropped from the build
      # is dropped here too rather than lingering.
      - name: Upload build to staging directory
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            'mkdir -p /tmp/lms-frontend'
          rsync -az --delete --stats \
            -e "ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem" \
            frontend/dist/frontend/browser/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/lms-frontend/"

      # deploy.ps1 did `rm -rf /var/www/lms/*` and then copied, leaving the site
      # empty for the duration. Building the new tree alongside and swapping
      # directories keeps that window to a rename.
      - name: Swap into place
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail

          if [ ! -s /tmp/lms-frontend/index.html ]; then
            echo "!! Upload looks empty (no index.html) — refusing to swap"
            exit 1
          fi

          sudo rm -rf /var/www/lms.new
          sudo cp -r /tmp/lms-frontend /var/www/lms.new
          sudo chown -R www-data:www-data /var/www/lms.new

          sudo rm -rf /var/www/lms.old
          if [ -d /var/www/lms ]; then sudo mv /var/www/lms /var/www/lms.old; fi
          sudo mv /var/www/lms.new /var/www/lms

          echo "==> Swapped. Previous build kept at /var/www/lms.old"
          REMOTE

      # Retries for the same reason as the backend's verify step: a transient
      # 502/504 right after a swap should not fail a deploy that worked.
      - name: Verify site
        run: |
          ok=0
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 https://lms.cranesvarsity.com || echo 000)
            if [ "$code" = "200" ]; then
              echo "https://lms.cranesvarsity.com -> HTTP 200 (attempt $i)"
              ok=1; break
            fi
            echo "  attempt $i: HTTP $code — retrying"
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Site did not return 200 after 12 attempts (~60s)"
            exit 1
          fi
