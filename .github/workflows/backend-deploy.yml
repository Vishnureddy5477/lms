name: Deploy Spring Boot Backend to EC2

# Unlike the assessment platform (Elastic Beanstalk), the LMS runs as a plain
# systemd service on a single EC2 box, so deployment is jar + restart over SSH.
#
# Runtime credentials are NOT supplied here. They live on the server in
# /opt/lms-backend/.env and reach the app through the unit's EnvironmentFile,
# so this pipeline only ever needs SSH access.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

concurrency:
  # Never let two deploys race for the same jar / service restart.
  group: lms-backend-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Uses the runner's Maven, not ./mvnw. This project only ever shipped the
      # Windows wrapper (mvnw.cmd) — the Unix `mvnw` script does not exist, so
      # `./mvnw` fails with exit 127 on a Linux runner. The wrapper pins Maven
      # 3.9.6 and ubuntu-latest already provides 3.9.x, so the build matches.
      # `clean package` (not the incremental `compile`) also matters: Maven's
      # incremental build has been observed reporting success on code that does
      # not actually compile.
      - name: Build jar
        run: mvn -B clean package -DskipTests
        working-directory: ./backend

      # ssh-keyscan exits non-zero when it cannot reach the host, and as the last
      # command in the block that failed the whole step with no usable message.
      # It is advisory only now, and the key is validated separately so a bad
      # paste is reported as a bad paste rather than a connection error.
      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy.pem
          chmod 600 ~/.ssh/deploy.pem

          if ssh-keygen -y -f ~/.ssh/deploy.pem > /dev/null 2>&1; then
            echo "SSH key parsed OK"
          else
            echo "::error::EC2_SSH_KEY is not a valid private key - re-paste it including the BEGIN/END lines"
            exit 1
          fi

          echo "Probing ${{ secrets.EC2_HOST }}:22 from this runner..."
          if ssh-keyscan -T 15 -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/tmp/keyscan.err; then
            echo "Host reachable, key pinned"
          else
            echo "::warning::ssh-keyscan could not reach the host. If the next step also fails, the EC2 security group is blocking GitHub runners on port 22."
            cat /tmp/keyscan.err || true
          fi

      - name: Upload jar
        run: |
          scp -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem \
            backend/target/template-0.0.1-SNAPSHOT.jar \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/lms-backend.jar"

      # Keeps the previous jar so a bad build can be put back automatically.
      # The old deploy.ps1 overwrote it with no way back.
      - name: Deploy, restart, health-gate (auto-rollback on failure)
        run: |
          ssh -o StrictHostKeyChecking=accept-new -i ~/.ssh/deploy.pem "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -se' <<'REMOTE'
          set -euo pipefail

          echo "==> Backing up current jar"
          sudo cp /opt/lms-backend/app.jar /opt/lms-backend/app.jar.prev

          echo "==> Installing new jar"
          sudo mv /tmp/lms-backend.jar /opt/lms-backend/app.jar
          sudo chown ubuntu:ubuntu /opt/lms-backend/app.jar

          # The unit file was edited on disk at some point without a reload,
          # so systemd was running a stale definition. Reload before restart.
          sudo systemctl daemon-reload
          sudo systemctl restart lms-backend

          echo "==> Waiting for the API to answer"
          ok=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8181/api/auth/login -X POST -H 'Content-Type: application/json' -d '{}' || echo 000)
            # Anything that is not 000/502 means Spring is up and routing.
            if [ "$code" != "000" ] && [ "$code" != "502" ]; then ok=1; echo "   healthy after ${i}s (HTTP $code)"; break; fi
            sleep 1
          done

          if [ "$ok" != "1" ]; then
            echo "!! Backend did not come up — rolling back to the previous jar"
            sudo mv /opt/lms-backend/app.jar /opt/lms-backend/app.jar.failed
            sudo cp /opt/lms-backend/app.jar.prev /opt/lms-backend/app.jar
            sudo chown ubuntu:ubuntu /opt/lms-backend/app.jar
            sudo systemctl restart lms-backend
            sudo journalctl -u lms-backend -n 40 --no-pager || true
            exit 1
          fi

          echo "==> Deployed. Service state: $(systemctl is-active lms-backend)"
          REMOTE

      - name: Verify public endpoint
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://lms.cranesvarsity.com/api/auth/login -X POST -H 'Content-Type: application/json' -d '{}')
          echo "https://lms.cranesvarsity.com/api -> HTTP $code"
          # 000 (unreachable) or 502 (nginx cannot reach the app) are failures.
          if [ "$code" = "000" ] || [ "$code" = "502" ]; then exit 1; fi
