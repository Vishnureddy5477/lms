# ── Server ────────────────────────────────────────────────────────
server.port=8181
# All controllers are exposed under /api (matches the Angular environment.apiUrl)
server.servlet.context-path=/api

# ── MySQL (legacy production RDS — same instance the old JSP portal uses) ──
# Credentials are NOT hardcoded here. Set these as environment variables before
# running the app, e.g. in PowerShell:
#   $env:DB_USERNAME = "crmuser"
#   $env:DB_PASSWORD = "<the password from CRMDao.java, or your own account>"
#   $env:JWT_SECRET   = "<any long random string, 32+ chars>"
# Default schema is cranescrm; exam_system/placement tables are reached via
# fully-qualified schema.table names (same DB user has access to all three).
spring.datasource.url=jdbc:mysql://cranescrmdb.ccifwmepkgrk.us-east-2.rds.amazonaws.com:3306/cranescrm?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────
# MUST stay "none" — these entities describe an existing, live, production
# schema shared with the legacy portal. Never let Hibernate create/alter it.
spring.jpa.hibernate.ddl-auto=none

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ── JWT ───────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=14400000

# ── Multipart uploads (enrollment photo, project docs, ticket attachments) ──
# 16MB matches the largest legacy client-side limit (ticket attachments in contact-us.jsp).
spring.servlet.multipart.max-file-size=16MB
spring.servlet.multipart.max-request-size=16MB

# ── S3 (enrollment photo upload — same bucket as the legacy app) ──
# Credentials are NOT here, same treatment as the DB password — set
# AWS_ACCESS_KEY / AWS_SECRET_KEY as environment variables (see set-local-env.ps1).
app.s3.bucket=cranes-space
app.s3.region=us-east-2
app.s3.access-key=${AWS_ACCESS_KEY}
app.s3.secret-key=${AWS_SECRET_KEY}

# ── CORS ──────────────────────────────────────────────────────────
# The Angular dev server origin (see CorsConfig.java)
app.cors.allowed-origin=http://localhost:4200

# ── SMTP (ticket notification emails — same account as legacy RaiseTicket.java) ──
# Credentials are NOT here, same treatment as DB/S3 — set SMTP_USERNAME /
# SMTP_PASSWORD as environment variables (see set-local-env.ps1).
spring.mail.host=m.outlook.com
spring.mail.port=587
spring.mail.username=${SMTP_USERNAME}
spring.mail.password=${SMTP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.trust=m.outlook.com
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
app.helpdesk.staff-email=vishnukant.reddy@cranesvarsity.com
