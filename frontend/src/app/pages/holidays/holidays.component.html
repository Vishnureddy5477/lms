<div class="container-fluid p-4 bg-light min-vh-100">
  <div class="card border-0 shadow-sm rounded-3">
    
    <!-- Card Header / Title -->
    <div class="card-header bg-white border-bottom p-3">
      <h5 class="fw-bold mb-0 text-dark">Search</h5>
    </div>

    <div class="card-body p-4">
      
      <!-- Table Controls: Pagination Entries & Search Input -->
<div class="d-flex justify-content-between align-items-center mb-4">
  <div class="d-flex align-items-center gap-2">
    <span class="text-dark small">Show</span>
    <select class="form-select form-select-sm form-control ng-valid ng-dirty ng-touched"
            style="width: 80px; min-width: 80px;" 
            [(ngModel)]="pageSize">
      <option [value]="10">10</option>
      <option [value]="25">25</option>
      <option [value]="50">50</option>
    </select>
    <span class="text-dark small">entries</span>
  </div>

        <div class="d-flex align-items-center gap-2">
          <label class="text-dark small mb-0">Search:</label>
          <input type="text" 
                 class="form-control form-control-sm text-dark" 
                 style="width: 200px;" 
                 [(ngModel)]="searchTerm" 
                 placeholder="">
        </div>
      </div>

      <!-- Holidays Table -->
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead class="table-light text-dark border-bottom">
            <tr>
              <th scope="col" style="width: 80px;"># <i class="bi bi-arrow-down-up fs-7 ms-1 text-dark"></i></th>
              <th scope="col">Title <i class="bi bi-arrow-down-up fs-7 ms-1 text-dark"></i></th>
              <th scope="col">Holiday Date <i class="bi bi-arrow-down-up fs-7 ms-1 text-dark"></i></th>
              <th scope="col">Day <i class="bi bi-arrow-down-up fs-7 ms-1 text-dark"></i></th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let holiday of filteredHolidays">
              <th scope="row" class="text-dark fw-normal">{{ holiday.id }}</th>
              <td class="fw-medium text-dark">{{ holiday.title }}</td>
              <td class="text-dark">{{ holiday.date }}</td>
              <td class="text-dark">{{ holiday.day }}</td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Table Footer / Pagination -->
      <div class="d-flex justify-content-between align-items-center mt-4 pt-2">
        <div class="text-dark small">
          Showing 1 to {{ filteredHolidays.length }} of {{ holidays.length }} entries
        </div>
        <nav aria-label="Page navigation">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item disabled">
              <a class="page-link text-dark" href="javascript:void(0)">&lt;</a>
            </li>
            <li class="page-item active">
              <a class="page-link text-white border-0" style="background-color: #5050ce;" href="javascript:void(0)">1</a>
            </li>
            <li class="page-item disabled">
              <a class="page-link text-dark" href="javascript:void(0)">&gt;</a>
            </li>
          </ul>
        </nav>
      </div>

    </div>
  </div>
</div>
