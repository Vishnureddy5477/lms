<div class="container-fluid p-4">

  <!-- White Outer Card Wrapper -->
  <div class="card border-0 shadow-sm rounded-4 bg-white p-4">
    
    <!-- Title -->
    <h6 class="fw-bold text-dark-purple mb-4">Programming Practice Questions</h6>

    <!-- 3-Column Card Grid -->
    <div class="row g-4">
      @if (loading) {
        <app-skeleton variant="table" [rows]="5" [columns]="4" />
      } @else if (topicsList.length === 0) {
        <div class="text-center text-muted py-4">No programming exercises available.</div>
      }
      @for (topic of topicsList; track topic.id) {
        <div class="col-12 col-md-6 col-lg-4">
          
          <!-- Topic Card -->
          <div class="card topic-card border-0 rounded-3 shadow-sm bg-white overflow-hidden h-100">
            
            <!-- Purple Top Header Banner -->
            <div class="card-header bg-purple-header text-white fw-bold py-3 px-3.5 fs-7 border-0">
              {{ topic.title }}
            </div>

            <!-- Card Body with View Questions Button -->
            <div class="card-body bg-white d-flex align-items-center justify-content-center p-4">
              <button 
                (click)="onViewQuestions(topic)" 
                class="btn btn-outline-purple font-medium px-3.5 py-1.5 rounded-2 fs-8"
              >
                View Questions
              </button>
            </div>

          </div>

        </div>
      }
    </div>

  </div>

</div>
