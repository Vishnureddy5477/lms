<div class="spv-root">

  <!-- Toolbar. Deliberately has no download, print, save or open-file control:
       there is nothing here to hide, because nothing here was ever built. -->
  <div class="spv-toolbar">

    <div class="spv-group">
      <button type="button" class="spv-btn" title="Previous page"
              [disabled]="currentPage <= 1 || isLoading" (click)="previousPage()">
        <i class="bi bi-chevron-up"></i>
      </button>
      <button type="button" class="spv-btn" title="Next page"
              [disabled]="currentPage >= totalPages || isLoading" (click)="nextPage()">
        <i class="bi bi-chevron-down"></i>
      </button>
      <input class="spv-page-input" type="text" inputmode="numeric"
             [value]="currentPage" [disabled]="isLoading"
             (change)="goToPage($any($event.target).value)"
             aria-label="Page number" />
      <span class="spv-page-count">of {{ totalPages || '–' }}</span>
    </div>

    <div class="spv-group">
      <button type="button" class="spv-btn" title="Zoom out" [disabled]="isLoading" (click)="zoomOut()">
        <i class="bi bi-dash-lg"></i>
      </button>
      <span class="spv-zoom">{{ zoomPercent }}%</span>
      <button type="button" class="spv-btn" title="Zoom in" [disabled]="isLoading" (click)="zoomIn()">
        <i class="bi bi-plus-lg"></i>
      </button>
      <button type="button" class="spv-btn" title="Fit to width" [disabled]="isLoading" (click)="fitWidth()">
        <i class="bi bi-arrows-angle-expand"></i>
      </button>
    </div>

    <div class="spv-group spv-group-end">
      @if (searchOpen) {
        <input class="spv-search-input" type="search" placeholder="Find in paper"
               [(ngModel)]="searchTerm" (input)="onSearch()"
               (keydown.enter)="findNext(false)" aria-label="Find in question paper" />
        <span class="spv-search-status">{{ searchStatus }}</span>
        <button type="button" class="spv-btn" title="Previous match" (click)="findNext(true)">
          <i class="bi bi-arrow-up"></i>
        </button>
        <button type="button" class="spv-btn" title="Next match" (click)="findNext(false)">
          <i class="bi bi-arrow-down"></i>
        </button>
      }
      <button type="button" class="spv-btn" title="Find" [disabled]="isLoading" (click)="toggleSearch()">
        <i class="bi" [class.bi-search]="!searchOpen" [class.bi-x-lg]="searchOpen"></i>
      </button>
    </div>

  </div>

  <!-- The pages. pdf.js writes into #viewer; the wrapper owns the scrolling. -->
  <div class="spv-stage">

    <div class="spv-container" #container>
      <div class="pdfViewer" #viewer></div>
    </div>

    @if (watermark) {
      <!-- Sits above the pages, ignores the pointer, and is repeated so a
           cropped screenshot still carries the student's name. -->
      <div class="spv-watermark" aria-hidden="true">
        @for (i of [0, 1, 2, 3, 4, 5, 6, 7, 8]; track i) {
          <span>{{ watermark }}</span>
        }
      </div>
    }

    @if (isLoading) {
      <div class="spv-overlay">
        <div class="spinner-border text-light" role="status"></div>
        <p class="mt-3 mb-0">Loading your question paper…</p>
      </div>
    }

    @if (errorMessage) {
      <div class="spv-overlay">
        <i class="bi bi-exclamation-triangle fs-1"></i>
        <p class="mt-3 mb-0">{{ errorMessage }}</p>
      </div>
    }

  </div>

</div>
