<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Cranes Varsity — Dashboard Template</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="shortcut icon" type="image/x-icon" href="https://cranesvarsitycrm.com/images/favicon.ico">
</head>
<!--
  IMPORTANT (do not remove these data-* attributes):
  The dashboard theme is driven entirely by them. They control the sidebar
  style, the nav-header background and whether the logo renders. Removing
  data-sidebar-style="full" will hide the logo in the top-left corner.
-->
<body data-theme-version="light" data-layout="vertical" data-nav-headerbg="color_2" data-headerbg="color_2" data-sidebar-style="full" data-sidebar-position="fixed" data-header-position="fixed" data-container="full" data-primary="color_1" data-typography="poppins">
  <app-root></app-root>
</body>
</html>
